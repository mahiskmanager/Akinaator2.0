<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akinator 2.0 - IA Suprema</title>
<style>
  /* FONDO Y TIPOGRAFÍA */
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #4a00e0, #8e2de2);
    color: #fff;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    overflow: hidden;
  }

  h1 {
    margin-top: 40px;
    font-size: 2.8em;
    text-shadow: 2px 2px 8px #000;
    animation: fadeIn 2s ease-in-out;
  }

  /* CONTENEDOR DEL CHAT */
  #chatContainer {
    width: 100%;
    max-width: 500px;
    background: rgba(0,0,0,0.4);
    margin-top: 20px;
    border-radius: 15px;
    padding: 20px;
    box-shadow: 0 0 20px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    animation: slideUp 1s ease-out;
  }

  /* MENSAJES */
  #messages {
    flex: 1;
    overflow-y: auto;
    margin-bottom: 15px;
    max-height: 400px;
  }

  .message {
    margin: 5px 0;
    padding: 10px;
    border-radius: 10px;
    max-width: 80%;
    word-wrap: break-word;
    opacity: 0;
    animation: fadeIn 0.5s forwards;
  }

  .userMessage {
    background: #4caf50;
    align-self: flex-end;
  }

  .botMessage {
    background: #2196f3;
    align-self: flex-start;
  }

  /* INPUT */
  #inputContainer {
    display: flex;
    gap: 10px;
  }

  input {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: none;
    font-size: 1em;
  }

  button {
    padding: 10px 20px;
    border: none;
    border-radius: 10px;
    background: #ff5722;
    color: #fff;
    cursor: pointer;
    font-size: 1em;
    transition: all 0.3s ease;
  }

  button:hover {
    background: #e64a19;
    transform: scale(1.05);
  }

  /* ANIMACIONES */
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes slideUp {
    from { transform: translateY(50px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
</style>
</head>
<body>
<h1>Akinator 2.0 - IA Suprema</h1>

<div id="chatContainer">
  <div id="messages"></div>
  <div id="inputContainer">
    <input id="userInput" type="text" placeholder="Escribe tu mensaje..." />
    <button onclick="sendMessage()">Enviar</button>
  </div>
</div>

<script>
async function sendMessage() {
  const input = document.getElementById('userInput');
  const messagesDiv = document.getElementById('messages');
  const text = input.value.trim();
  if (!text) return;

  // Mostrar mensaje del usuario
  const userMsgDiv = document.createElement('div');
  userMsgDiv.classList.add('message', 'userMessage');
  userMsgDiv.innerText = text;
  messagesDiv.appendChild(userMsgDiv);

  input.value = '';
  messagesDiv.scrollTop = messagesDiv.scrollHeight;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });

    const data = await res.json();

    let reply = data.reply;

    // Si devuelve un objeto, extraer texto
    if (typeof reply === 'object') {
      reply = reply.output_text || 
              (reply.output?.[0]?.content?.[0]?.text) || 
              JSON.stringify(reply);
    }

    const botMsgDiv = document.createElement('div');
    botMsgDiv.classList.add('message', 'botMessage');
    botMsgDiv.innerText = reply;
    messagesDiv.appendChild(botMsgDiv);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;

  } catch (err) {
    const errDiv = document.createElement('div');
    errDiv.classList.add('message', 'botMessage');
    errDiv.innerText = "Error conectando con el servidor";
    messagesDiv.appendChild(errDiv);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }
}
</script>
</body>
</html>
