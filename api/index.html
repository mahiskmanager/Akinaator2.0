<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akinator 2.0 - IA Suprema</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #4a00e0, #8e2de2);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 50px;
    min-height: 100vh;
    margin: 0;
  }

  h1 {
    font-size: 2.5em;
    margin-bottom: 30px;
    text-shadow: 2px 2px 5px #000;
  }

  #chatContainer {
    width: 100%;
    max-width: 500px;
    background: rgba(0,0,0,0.4);
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 0 20px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    margin-bottom: 15px;
  }

  .message {
    margin: 5px 0;
    padding: 10px;
    border-radius: 10px;
    max-width: 80%;
  }

  .userMessage {
    background: #4caf50;
    align-self: flex-end;
  }

  .botMessage {
    background: #2196f3;
    align-self: flex-start;
  }

  #inputContainer {
    display: flex;
    gap: 10px;
  }

  input {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: none;
    font-size: 1em;
  }

  button {
    padding: 10px 20px;
    border: none;
    border-radius: 10px;
    background: #ff5722;
    color: #fff;
    cursor: pointer;
    font-size: 1em;
  }

  button:hover {
    background: #e64a19;
  }
</style>
</head>
<body>
<h1>Akinator 2.0 - IA Suprema</h1>

<div id="chatContainer">
  <div id="messages"></div>
  <div id="inputContainer">
    <input id="userInput" type="text" placeholder="Escribe tu mensaje..." />
    <button onclick="sendMessage()">Enviar</button>
  </div>
</div>

<script>
async function sendMessage() {
  const input = document.getElementById('userInput');
  const messagesDiv = document.getElementById('messages');
  const text = input.value.trim();
  if (!text) return;

  // Mostrar mensaje del usuario
  const userMsgDiv = document.createElement('div');
  userMsgDiv.classList.add('message', 'userMessage');
  userMsgDiv.innerText = text;
  messagesDiv.appendChild(userMsgDiv);

  input.value = '';
  messagesDiv.scrollTop = messagesDiv.scrollHeight;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });

    const data = await res.json();

    const botMsgDiv = document.createElement('div');
    botMsgDiv.classList.add('message', 'botMessage');
    botMsgDiv.innerText = data.reply || data.error || "Sin respuesta";
    messagesDiv.appendChild(botMsgDiv);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;

  } catch (err) {
    const errDiv = document.createElement('div');
    errDiv.classList.add('message', 'botMessage');
    errDiv.innerText = "Error conectando con el servidor";
    messagesDiv.appendChild(errDiv);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }
}
</script>
</body>
</html>
