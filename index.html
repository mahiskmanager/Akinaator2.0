
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akinator 2.0 - IA Suprema</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="particles-js"></div>

<div id="mascota-container">
  <img id="mascota" src="https://media.giphy.com/media/3oEjI6SIIHBdRxXI40/giphy.gif" alt="Mascota interactiva">
</div>

<h1>Akinator 2.0 - IA Suprema</h1>

<div id="chatContainer">
  <div id="messages"></div>
  <div id="inputContainer">
    <input id="userInput" type="text" placeholder="Escribe tu mensaje..." />
    <button onclick="sendMessage()">Enviar</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
<script src="script.js"></script>
<script>
particlesJS('particles-js', {
  "particles": {
    "number": { "value": 80 },
    "color": { "value": "#ffffff" },
    "shape": { "type": "circle" },
    "opacity": { "value": 0.5 },
    "size": { "value": 3 },
    "line_linked": { "enable": true, "distance": 150, "color": "#ffffff", "opacity": 0.4, "width": 1 },
    "move": { "enable": true, "speed": 2, "direction": "none", "out_mode": "bounce" }
  },
  "interactivity": {
    "detect_on": "canvas",
    "events": { "onhover": { "enable": true, "mode": "repulse" }, "onclick": { "enable": true, "mode": "push" } }
  },
  "retina_detect": true
});
</script>
</body>
</html>
